      - delayed_off: 50ms

  - platform: gpio
    name: "Gauges Button"
    id: button_14
    entity_category: diagnostic
    pin:
      pcf8574: pcf8574_hub_in_2
      number: 5
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - switch.toggle: relay_14

  # v2.1.9 - LOCKING (maintained) switch, not momentary. The other ten buttons
  # are spring-return and use on_press + switch.toggle; that is wrong here,
  # because a latching switch never generates a second press to turn things
  # off. This one drives the relay from both EDGES so the relay follows the
  # switch - but only once armed (see the boot lockout in esphome: on_boot).
  - platform: gpio
    name: "Stabilisers Button"
    id: button_15
    entity_category: diagnostic
    pin:
      pcf8574: pcf8574_hub_in_2
      number: 6
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    on_press:
      - if:
          condition:
            lambda: 'return id(stab_armed);'
          then:
            - switch.turn_on: relay_15
          else:
            - logger.log: "Stabilisers: switch ON ignored - still in boot lockout"
    on_release:
      - if:
          condition:
            lambda: 'return id(stab_armed);'
          then:
            - switch.turn_off: relay_15

