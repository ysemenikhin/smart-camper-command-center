script:
  # v2.2.0 - see the note on relay_15. mode: restart so switching the
  # stabilisers off and on again restarts the full 10 minutes rather than
  # inheriting whatever was left of the previous run.
  - id: stabiliser_timeout
    mode: restart
    then:
      - delay: 10min
      - logger.log: "Stabilisers: 10 minute timeout - cutting power"
      - switch.turn_off: relay_15

  # Compares the code that just arrived against each stored slot and holds
  # the matching sensor ON while the fob keeps repeating; mode: restart
  # re-arms the off-timer on every received code, so the sensor drops OFF
  # 200ms after the last repeat.
  # v2.3.6 - window 500ms -> 200ms. Repeats inside one press arrive every
  # ~40 ms (82 ms max seen), separate taps were 369-487 ms apart: 200ms keeps
  # a held press as one pulse and lets separate taps through. HA receives ON
  # and OFF as pushed events, so the shorter pulse is still caught.
  # v2.3.6 - a code matching a DIFFERENT learned slot releases the other
  # slots at once (B2 -> B1 -> B2 now fires B2 twice). Two slots holding the
  # same code still both fire. Unknown codes never reach this script - see
  # the v2.3.6 gate in on_rc_switch.
  - id: rf_check_slots
    mode: restart
    then:
      - lambda: |-
          std::string s = id(rf_last_code).state;
          if (s.empty()) return;
          bool m1 = (s == id(rf_slot_1).state);
          bool m2 = (s == id(rf_slot_2).state);
          bool m3 = (s == id(rf_slot_3).state);
          bool m4 = (s == id(rf_slot_4).state);
          bool m5 = (s == id(rf_slot_5).state);
          bool m6 = (s == id(rf_slot_6).state);
          if (!(m1 || m2 || m3 || m4 || m5 || m6)) return;   // not a learned code: leave the slots alone
          id(rf_match_1).publish_state(m1);
          id(rf_match_2).publish_state(m2);
          id(rf_match_3).publish_state(m3);
          id(rf_match_4).publish_state(m4);
          id(rf_match_5).publish_state(m5);
          id(rf_match_6).publish_state(m6);
      - delay: 200ms
      - lambda: |-
          id(rf_match_1).publish_state(false);
          id(rf_match_2).publish_state(false);
          id(rf_match_3).publish_state(false);
          id(rf_match_4).publish_state(false);
          id(rf_match_5).publish_state(false);
          id(rf_match_6).publish_state(false);


# ============================================================
# TANK CALIBRATION   -   values are BOARD-READ millivolts
#
# HOW TO SET THESE (no maths, no multimeter):
#   1. Turn on "Water Gauges".
#   2. With the tank EMPTY, read "Clear Tank Voltage" (a diagnostic sensor,
#      in volts) and enter it x1000 as "Clear Tank Empty mV".
#   3. Fill to the brim, read it again, enter as "Clear Tank Full mV".
#   4. Same for grey. Done.
#
# Why not the sender millivolts measured at the wire: the A16S analog inputs
# are a conditioned 0-5V front end, so the ADC sees the sender through a
# board divider of unknown ratio. Calibrating on the board's own reported
# voltage cancels that ratio out. Do NOT fit an external divider.
#
# Sender-side measurements taken 2026-09-25, for reference / sanity only:
#   clear  12% on the digital gauge @ 375.0 then 388.9 mV
#   grey    0% on the digital gauge @  37.0 then  41.2 mV
#   -> ~30 mV per %, zero at ~0 mV (the ~40 mV on grey is not an electrical
#      offset, it is ~3 mm of water left in the bottom of a drained tank:
#      1.4% of a 20-25 cm deep tank). Full scale should be ~3000-3100 mV at
#      the sender. Expect ~50% at roughly half that.
#   -> resolution is ~120-145 mV per cm of water, so the few mV of observed
#      drift is about 0.3 mm. Noise is a non-issue.
# ============================================================
number:
  - platform: template
    name: "Clear Tank Empty mV"
    id: clear_empty_mv
    unit_of_measurement: "mV"
    min_value: 0
    max_value: 1000
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  - platform: template
    name: "Clear Tank Full mV"
    id: clear_full_mv
    unit_of_measurement: "mV"
    min_value: 500
    max_value: 3100
    step: 1
    initial_value: 3000
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  - platform: template
    name: "Grey Tank Empty mV"
    id: grey_empty_mv
    unit_of_measurement: "mV"
    min_value: 0
    max_value: 1000
    step: 1
    initial_value: 0
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config

  - platform: template
    name: "Grey Tank Full mV"
    id: grey_full_mv
    unit_of_measurement: "mV"
    min_value: 500
    max_value: 3100
    step: 1
    initial_value: 3000
    restore_value: true
    optimistic: true
    mode: box
    entity_category: config


