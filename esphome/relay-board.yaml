      pcf8574: pcf8574_hub_out_2
      number: 0
      mode: OUTPUT
      inverted: true

  - platform: gpio
    name: "Awning Red Right"
    id: relay_10
    restore_mode: RESTORE_DEFAULT_OFF
    pin:
      pcf8574: pcf8574_hub_out_2
      number: 1
      mode: OUTPUT
      inverted: true

  - platform: gpio
    name: "Inverter"
    id: relay_11
    restore_mode: RESTORE_DEFAULT_OFF
    pin:
      pcf8574: pcf8574_hub_out_2
      number: 2
      mode: OUTPUT
      inverted: true
    # RE11 is the dry contact that actually switches the inverter. RE12 only
    # lights the B11 button LED (B11 has no lamp of its own), so it is ganged
    # here rather than in an HA automation - that way the LED is still correct
    # if Home Assistant is down.
    on_turn_on:
      - switch.turn_on: relay_12
    on_turn_off:
      - switch.turn_off: relay_12

  - platform: gpio
    name: "Inverter LED"
    id: relay_12
    restore_mode: RESTORE_DEFAULT_OFF
    pin:
      pcf8574: pcf8574_hub_out_2
      number: 3
      mode: OUTPUT
      inverted: true
    entity_category: diagnostic

  # v2.2.0 - RE13 now feeds the ELECTRIC STEPS, split off the 90A stabiliser
  # circuit so the two can follow different rules. The steps need power for
  # hours or days while camped (the door reed drives them automatically),
  # whereas the legs and front jack should only be live for minutes.
  # ALWAYS_ON: the steps are the low-risk load - no exposed buttons, only the
  # door reed - and if this came up off after a reboot the automatic steps
  # would silently stop working until the next time you opened the door and
  # nothing happened. DI12 still switches it off by hand for travel.
  - platform: gpio
    name: "Steps"
    id: relay_13
    icon: mdi:stairs
    restore_mode: ALWAYS_ON
    pin:
      pcf8574: pcf8574_hub_out_2
      number: 4
      mode: OUTPUT
      inverted: true

  - platform: gpio
    name: "Water Gauges"
    id: relay_14
    restore_mode: RESTORE_DEFAULT_OFF
    pin:
      pcf8574: pcf8574_hub_out_2
      number: 5
      mode: OUTPUT
      inverted: true

  # v2.1.9 - RE15 drives a 90A contactor feeding the corner stabiliser jacks,
  # the front hitch jack and the electric steps, from their own fuse box.
  # ALWAYS_OFF, never RESTORE: powering that circuit unattended after a reboot
  # is dangerous, so it must always come up dead regardless of what it was
  # doing before.
  - platform: gpio
    name: "Stabilisers"
    id: relay_15
    icon: mdi:screw-lag
    restore_mode: ALWAYS_OFF
    pin:
      pcf8574: pcf8574_hub_out_2
      number: 6
      mode: OUTPUT
      inverted: true
    # v2.2.0 - 10 MINUTE AUTO-OFF. The real risk here is not driving away with
    # legs down; it is that the front jack's up/down buttons are physically
    # exposed, so anyone can press them while the trailer is parked and you are
    # not there - and that reaching into the storage box can nudge a leg switch
    # by accident. A dead circuit makes all of those buttons do nothing.
    # The circuit only genuinely needs power for the few minutes of hitching,
    # unhitching or setting up, so it times itself out rather than relying on
    # anyone remembering. Switch it on again by hand whenever you need it.
    on_turn_on:
      - script.execute: stabiliser_timeout
    on_turn_off:
      - script.stop: stabiliser_timeout

  # v2.2.0 - RESERVED, nothing wired to it yet. One circuit feeding both the
  # tank heating pad and the water-pipe heater (the owner: "for both"). Named now
  # so the entity id is settled before anything depends on it - renaming it
  # later would mean another dashboard migration.
  - platform: gpio
    name: "Tank & Pipe Heater"
    id: relay_16
    icon: mdi:heat-wave
    restore_mode: ALWAYS_OFF
    pin:
      pcf8574: pcf8574_hub_out_2
      number: 7
      mode: OUTPUT
      inverted: true


# ============================================================
# TANK LEVEL SENSORS  (AI1 / AI2)
# The gauge senders are only powered when RE14 is on, so when the gauges are
# off we publish NAN (HA shows "unavailable") instead of a misleading 0%.
# ============================================================
sensor:
  # v2.3.8 - 15 min interval = 96 rows/day (every 60 s would be 1,440).
  - platform: uptime
    name: "Uptime"
    update_interval: 15min
    entity_category: diagnostic

  - platform: adc
    pin: GPIO36          # AI1 = ANALOG_A1 - confirmed in KC868-A16S docs
    id: ai1_raw
    name: "Clear Tank Voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 3
    attenuation: 12db
    update_interval: 5s
    entity_category: diagnostic
    # v2.1.5 - measured 282..300 mV on a still tank = 18 mV peak-to-peak.
    # At 14.05 mV per 1% of tank that is 1.28% of visible jitter, which is
    # exactly the 11-12.5% wobble seen in HA.
    #   samples: 32  averages 32 reads INSIDE each update. Noise falls with
    #                sqrt(N), so 32 cuts it to ~0.23%. This was set to 1,
    #                i.e. no averaging at all - the single biggest win here.
    #   median 5     rejects the occasional one-off spike (25s of history).
    #   sliding avg  12 x 5s = a 60s mean -> ~0.07% residual jitter.
    # Still publishes every 5s; the window just slides. A tank cannot change
    # meaningfully in 60s unless you are actively filling it, so the settling
    # time costs nothing.
    samples: 32
    filters:
      - median:
          window_size: 5
          send_every: 1
      - sliding_window_moving_average:
          window_size: 12
          send_every: 1
      # v2.1.8 - publish at 1 mV resolution. Without this the full float goes
      # to HA ("0.29166665673255920"), so EVERY 5s update was a new database
      # row: 12,312 rows/day from this one sensor. accuracy_decimals only
      # affects DISPLAY, not the stored value. HA writes a row only when the
      # state string changes, so rounding a now-stable value cuts the churn
      # without losing anything you can read.
      - round: 3

  - platform: adc
    pin: GPIO34          # AI2 = ANALOG_A2 - confirmed (GPIO39 is A4)
    id: ai2_raw
    name: "Grey Tank Voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 3
    attenuation: 12db
    update_interval: 5s
    entity_category: diagnostic
    # v2.1.5 - measured 282..300 mV on a still tank = 18 mV peak-to-peak.
    # At 14.05 mV per 1% of tank that is 1.28% of visible jitter, which is
    # exactly the 11-12.5% wobble seen in HA.
    #   samples: 32  averages 32 reads INSIDE each update. Noise falls with
    #                sqrt(N), so 32 cuts it to ~0.23%. This was set to 1,
    #                i.e. no averaging at all - the single biggest win here.
    #   median 5     rejects the occasional one-off spike (25s of history).
    #   sliding avg  12 x 5s = a 60s mean -> ~0.07% residual jitter.
    # Still publishes every 5s; the window just slides. A tank cannot change
    # meaningfully in 60s unless you are actively filling it, so the settling
    # time costs nothing.
    samples: 32
    filters:
      - median:
          window_size: 5
          send_every: 1
      - sliding_window_moving_average:
          window_size: 12
          send_every: 1
      # v2.1.8 - publish at 1 mV resolution. Without this the full float goes
      # to HA ("0.29166665673255920"), so EVERY 5s update was a new database
      # row: 12,312 rows/day from this one sensor. accuracy_decimals only
      # affects DISPLAY, not the stored value. HA writes a row only when the
      # state string changes, so rounding a now-stable value cuts the churn
      # without losing anything you can read.
      - round: 3

  - platform: template
    name: "Clear Water Tank"
    id: clear_tank_pct
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: mdi:cup-water
    update_interval: 5s
    lambda: |-
      if (!id(relay_14).state) return NAN;          // gauges off -> no signal
      float v = id(ai1_raw).state; if (isnan(v)) return NAN;
      float mv = v * 1000.0f;
      float e = id(clear_empty_mv).state, f = id(clear_full_mv).state;
      if (isnan(e) || isnan(f) || f <= e) return NAN;
      float p = (mv - e) / (f - e) * 100.0f;
      return p < 0 ? 0 : (p > 100 ? 100 : p);
    # v2.1.8 - 0.1% resolution; see the note on the voltage sensors.
    filters:
      - round: 1

  - platform: template
    name: "Grey Water Tank"
    id: grey_tank_pct
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: mdi:water-opacity
    update_interval: 5s
    lambda: |-
      if (!id(relay_14).state) return NAN;
      float v = id(ai2_raw).state; if (isnan(v)) return NAN;
      float mv = v * 1000.0f;
      float e = id(grey_empty_mv).state, f = id(grey_full_mv).state;
      if (isnan(e) || isnan(f) || f <= e) return NAN;
      float p = (mv - e) / (f - e) * 100.0f;
      return p < 0 ? 0 : (p > 100 ? 100 : p);
    # v2.1.8 - 0.1% resolution; see the note on the voltage sensors.
    filters:
      - round: 1

  # ---- v2.3.2: DS18B20 TEMPERATURES (1-Wire bus on GPIO14) ----
  # Tag = last 4 hex digits of the address, as written on the sensor label.
  # round 0.1 C: DS18B20 resolution is 0.0625 C; rounding keeps a steady
  # reading from writing a new database row every update.
  - platform: dallas_temp
    one_wire_id: ow_bus
    address: !secret ds18b20_clean_tank
    name: "Clean Water Tank Temp"
    update_interval: 60s
    filters:
      - offset: -0.07   # v2.3.5 - 3-reading average vs Grey
      - round: 1
  - platform: dallas_temp
    one_wire_id: ow_bus
    address: !secret ds18b20_grey_tank
    name: "Grey Water Tank Temp"
    update_interval: 60s
    filters:
      - offset: 0.0   # v2.3.5 - 3-reading average vs Grey
      - round: 1
  - platform: dallas_temp
    one_wire_id: ow_bus
    address: !secret ds18b20_pipe_1
    name: "Water Pipe 1 Temp"
    update_interval: 60s
    filters:
      - offset: -0.3   # v2.3.5 - 3-reading average vs Grey
      - round: 1
  - platform: dallas_temp
    one_wire_id: ow_bus
    address: !secret ds18b20_pipe_2
    name: "Water Pipe 2 Temp"
    update_interval: 60s
    filters:
      - offset: -0.1   # v2.3.5 - 3-reading average vs Grey
      - round: 1


