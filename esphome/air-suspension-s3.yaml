# ============================================================
# BINARY SENSORS
# ============================================================

binary_sensor:
  # v5.0.1 - true while connected to Home Assistant (API). Drives the status LED.
  - platform: status
    name: "HA Connected"
    id: ha_connected
    internal: true
  - platform: template
    name: "Manifold Connected"
    id: camper_manifold_connected
    device_class: connectivity
    entity_category: diagnostic

  # v4.4.10 - true for ~2s right after Off-Road articulation engages, so the
  # dashboard button can flash while turning on, then sit solid amber.
  - platform: template
    name: "Articulation Settling"
    id: camper_artic_settling
    entity_category: diagnostic

  # v4.5.2 - Gen3 frame uses 100 as the "no sensor" sentinel. A ruler pinned
  # at ~100% while its corner PSI is mid-range (25..65) for 30s is a fault
  # (unplugged/failed), NOT strapped-out. Warn; the height loops also treat a
  # >=99.5% reading as "satisfied" so a dead ruler cannot dump a real corner.
  - platform: template
    name: "Height Sensor Suspect"
    id: height_sensor_suspect
    device_class: problem
    icon: mdi:ruler-square-compass
    on_press:
      # v4.5.11: a suspect ruler latches presets/maintain to PSI (manual restore).
      - if:
          condition:
            switch.is_off: preset_mode_psi
          then:
            - switch.turn_on: preset_mode_psi
            - logger.log: "CAMPER: Height sensor suspect -> Preset Mode latched to PSI"
    lambda: |-
      auto susp = [](float h, float pr) -> bool {
        return !isnan(h) && !isnan(pr) && h >= 99.5f && pr > 25.0f && pr < 65.0f;
      };
      return susp(id(camper_height_fl).state, id(camper_suspension_front_left_psi).state)
          || susp(id(camper_height_fr).state, id(camper_suspension_front_right_psi).state)
          || susp(id(camper_height_rl).state, id(camper_suspension_rear_left_psi).state)
          || susp(id(camper_height_rr).state, id(camper_suspension_rear_right_psi).state);
    filters:
      - delayed_on: 30s
      - delayed_off: 5s

  # v4.5.10 - true the whole time the compressor is running (latch above); the
  # dashboard blinks the tank digits on THIS, so it signals the full pump-up.
  - platform: template
    name: "Compressor Running"
    id: compressor_running
    device_class: running
    icon: mdi:engine
    lambda: 'return id(compressor_on);'

  - platform: template
    name: "Air Bag Overpressure"
    id: air_bag_overpressure
    device_class: problem
    icon: mdi:alert-octagon
    lambda: |-
      float cap = id(emergency_cap_psi).state;
      if (isnan(cap)) return {};
      float fl = id(camper_suspension_front_left_psi).state;
      float fr = id(camper_suspension_front_right_psi).state;
      float rl = id(camper_suspension_rear_left_psi).state;
      float rr = id(camper_suspension_rear_right_psi).state;
      bool any = (!isnan(fl) && fl >= cap) ||
                 (!isnan(fr) && fr >= cap) ||
                 (!isnan(rl) && rl >= cap) ||
                 (!isnan(rr) && rr >= cap);
      return any;
    # v4.4.11: only warn on a SUSTAINED condition - ignores the brief PSI
    # spike the manifold reports while a valve actuates (raise/lower).
    filters:
      - delayed_on: 4s
      - delayed_off: 2s

  - platform: template
    name: "Air Bag Underpressure"
    id: air_bag_underpressure
    device_class: problem
    icon: mdi:alert-circle-outline
    lambda: |-
      float flr = id(min_corner_psi).state;
      if (isnan(flr)) return {};
      float fl = id(camper_suspension_front_left_psi).state;
      float fr = id(camper_suspension_front_right_psi).state;
      float rl = id(camper_suspension_rear_left_psi).state;
      float rr = id(camper_suspension_rear_right_psi).state;
      bool any = (!isnan(fl) && fl <= flr) ||
                 (!isnan(fr) && fr <= flr) ||
                 (!isnan(rl) && rl <= flr) ||
                 (!isnan(rr) && rr <= flr);
      return any;
    filters:
      - delayed_on: 4s
      - delayed_off: 2s

  # ---- PHYSICAL CONTROL BUTTONS ----
  - platform: gpio
    name: "Manifold Button"
    id: compressor_button
    icon: mdi:gesture-tap-button
    entity_category: diagnostic
    pin:
      number: GPIO15
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
    on_press:
      - logger.log: "CAMPER: Manifold button pressed - toggling relay"
      - switch.toggle: compressor_relay

  - platform: gpio
    name: "Load Share Button"
    id: load_share_button
    icon: mdi:gesture-tap-button
    entity_category: diagnostic
    pin:
      number: GPIO14
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on: 50ms
    on_press:
      - logger.log: "CAMPER: Load Share button pressed - toggling relay"
      - switch.toggle: load_sharing_relay

# ============================================================
# TEXT SENSORS
# ============================================================

text_sensor:
  - platform: template
    name: "Config Version"
    id: config_version_sensor
    icon: mdi:tag-text
    entity_category: diagnostic
    update_interval: 3600s
    lambda: |-
      return std::string("${config_version} (${config_date})");

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "SSID"
      entity_category: diagnostic

  - platform: template
    name: "Pitch Direction"
    id: pitch_direction
    icon: mdi:axis-z-rotate-clockwise
    update_interval: 1s
    lambda: |-
      float pitch = id(imu_pitch).state;
      if (isnan(pitch)) return {"Unknown"};
      float thresh = id(level_threshold).state;
      if (isnan(thresh)) thresh = 0.5f;
      if (pitch >  thresh)  return {"Nose Up"};
      if (pitch < -thresh)  return {"Nose Down"};
      return {"Level"};

  - platform: template
    name: "Roll Direction"
    id: roll_direction
    icon: mdi:axis-x-rotate-clockwise
    update_interval: 1s
    lambda: |-
      float roll = id(imu_roll).state;
      if (isnan(roll)) return {"Unknown"};
      float thresh = id(level_threshold).state;
      if (isnan(thresh)) thresh = 0.5f;
      if (roll >  thresh)  return {"Right Side Down"};
      if (roll < -thresh)  return {"Left Side Down"};
      return {"Level"};

  # v2.0.0 - preset state machine for the dashboard
  # Idle / Applying X / Reached X / Maintaining X / Aborted - reason
  - platform: template
    name: "Preset Status"
    id: preset_status
    icon: mdi:state-machine

  - platform: template
    name: "Front Jack Advice"
    id: front_jack_advice
    icon: mdi:tools
    update_interval: 2s
    lambda: |-
      float pitch  = id(imu_pitch).state;
      float thresh = id(level_threshold).state;
      if (isnan(pitch) || isnan(thresh)) return {"Unknown"};
      if (fabsf(pitch) <= thresh) return {"Not needed"};

      float fl = id(camper_suspension_front_left_psi).state;
      float fr = id(camper_suspension_front_right_psi).state;
      float rl = id(camper_suspension_rear_left_psi).state;
      float rr = id(camper_suspension_rear_right_psi).state;
      float min_psi = id(min_corner_psi).state;
      float max_psi = id(max_corner_psi).state;
      if (isnan(min_psi) || isnan(max_psi)) return {"Unknown"};

      if (pitch > thresh) {
        bool can_lower_front = (!isnan(fl) && fl > min_psi) ||
                               (!isnan(fr) && fr > min_psi);
        bool can_raise_rear  = (!isnan(rl) && rl < max_psi) ||
                               (!isnan(rr) && rr < max_psi);
        if (!can_lower_front && !can_raise_rear) return {"Lower front jack"};
        return {"Air bags handling"};
      } else {
        bool can_raise_front = (!isnan(fl) && fl < max_psi) ||
                               (!isnan(fr) && fr < max_psi);
        bool can_lower_rear  = (!isnan(rl) && rl > min_psi) ||
                               (!isnan(rr) && rr > min_psi);
        if (!can_raise_front && !can_lower_rear) return {"Raise front jack"};
        return {"Air bags handling"};
      }

# ============================================================
# SWITCHES
# ============================================================

switch:
  # Load Sharing relay
  # ON  = bypass valves open  -> FL<->RL and FR<->RR pneumatically linked
  # OFF = corners isolated
  - platform: gpio
    name: "Load Sharing (Off-Road Articulation)"
    id: load_sharing_relay
    icon: mdi:rotate-3d-variant
    pin:
      number: GPIO17
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_OFF
    # v4.4.4 INTERLOCK: off-road articulation and auto-maintain are mutually
    # exclusive, sequenced so maintain never runs against open valves.
    on_turn_on:
      # Entering off-road: abort any auto-level, kill auto-maintain FIRST (the
      # supervisor is also hard-gated off), then the bypass valves are open.
      - lambda: 'id(leveling_active) = false;'
      - script.stop: auto_level
      - binary_sensor.template.publish:
          id: camper_artic_settling
          state: ON
      - switch.turn_off: preset_auto_maintain
      - logger.log: "CAMPER: Off-Road articulation ON -> auto-maintain OFF, side valves open"
      - delay: 2000ms
      - binary_sensor.template.publish:
          id: camper_artic_settling
          state: OFF
    on_turn_off:
      # Leaving off-road: valves are closing; let the shared volume settle,
      # THEN re-enable auto-maintain. Gated on manifold connected so a
      # boot-time restore-OFF can't spuriously turn maintain on.
      - binary_sensor.template.publish:
          id: camper_artic_settling
          state: OFF
      - logger.log: "CAMPER: Off-Road articulation OFF -> valves closed, settling 1.5s"
      - delay: 1500ms
      # v5.0.3: Auto-Maintain is now MANUAL-ONLY - it is never switched on by
      # code. Leaving off-road no longer re-enables it; the user turns it on.
      - logger.log: "CAMPER: Off-road exit - Auto-maintain left OFF (manual only)"

  # v2.0.0 - Air Manifold master relay (was "Compressor").
  # Powers the whole manifold - when OFF, no suspension control at all.
  # ALWAYS_ON: manifold is re-energized automatically after every
  # ESP reboot, so control (and gear state) survives power cycles.
  - platform: gpio
    name: "Air Manifold"
    id: compressor_relay
    icon: mdi:pipe-valve
    pin:
      number: GPIO16
      mode: OUTPUT
      inverted: true
    restore_mode: ALWAYS_ON

  # v4.3.0 - IMU orientation toggles (hidden, config category).
  # One-time setup: park level, do the 30s tilt test, flip as needed.
  #   Swap    : if lifting a SIDE moves the Pitch dial (and the tongue
  #             moves Roll), turn this ON to swap them back.
  #   Invert  : if the correct dial moves the WRONG way (up = negative),
  #             turn the matching Invert ON. Invert is display-only, so
  #             0 stays 0 - no need to recalibrate after flipping it.
  # After changing SWAP, press Calibrate Level Zero again.
  - platform: template
    name: "IMU Swap Roll Pitch"
    id: imu_swap_axes
    icon: mdi:swap-horizontal
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "IMU Invert Roll"
    id: imu_invert_roll
    icon: mdi:flip-horizontal
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    name: "IMU Invert Pitch"
    id: imu_invert_pitch
    icon: mdi:flip-vertical
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # v3.1.0 - Manual BLE link control. OFF = ESP releases the
  # manifold so the DOWN phone app can connect. ON = ESP owns it.
  - platform: template
    name: "Manifold BLE Link"
    id: manifold_ble_link
    icon: mdi:bluetooth
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - logger.log: "CAMPER: BLE link ON - will connect on next advertisement"
      - lambda: 'id(last_connect_try_ms) = 0;'
    turn_off_action:
      - logger.log: "CAMPER: BLE link OFF - disconnecting from manifold"
      - ble_client.disconnect: camper_manifold

  # v4.5.11 - Preset control metric. OFF = ruler HEIGHT % (default, sensors
  # installed). ON = air-bag PSI (limp-home if a ruler fails). Same 10 mode
  # sliders serve both; the PSI target set is separate so both are remembered.
  - platform: template
    name: "Preset Mode PSI"
    id: preset_mode_psi
    icon: mdi:gauge-low
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - logger.log: "CAMPER: Preset Mode -> PSI (height-sensor fallback)"
    turn_off_action:
      - logger.log: "CAMPER: Preset Mode -> Height %"

  # v2.0.0 - Manual/Auto preset behavior.
  # OFF (Manual): selecting a mode applies once, drift is ignored.
  # ON  (Auto):   supervisor re-adjusts whenever pressure drifts
  #               out of the deadband from the selected mode.
  - platform: template
    name: "Preset Auto Maintain"
    id: preset_auto_maintain
    icon: mdi:sync
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - logger.log: "CAMPER: Preset Auto Maintain ENABLED"
    turn_off_action:
      - logger.log: "CAMPER: Preset Auto Maintain DISABLED"

# ============================================================
# SELECT - GEAR DROPDOWN (v2.0.0: auto-applies on selection)
# ============================================================

select:
  - platform: template
    name: "Gear"
    id: camper_gear_select
    icon: mdi:car-shift-pattern
    optimistic: true
    restore_value: true
    options:
      - "Highway Normal Load"
      - "Highway Heavy Load"
      - "Off-Road"
      - "Parked"
      - "Easy Maneuver"
    on_value:
      then:
        - if:
            condition:
              and:
                - binary_sensor.is_on: camper_manifold_connected
                # v4.4.5: don't apply a gear mid-auto-level (avoids BLE clash).
                - lambda: 'return !id(leveling_active);'
            then:
              # v4.4.8: Off-Road MODE auto-engages articulation; any other
              # mode disengages it. The load_sharing interlock then flips
              # auto-maintain (OFF while articulating / ON otherwise). On the
              # other modes you can still toggle articulation by hand.
              - if:
                  condition:
                    lambda: 'return id(camper_gear_select).current_option() == std::string("Off-Road");'
                  then:
                    - switch.turn_on: load_sharing_relay
                  else:
                    - switch.turn_off: load_sharing_relay
              - logger.log:
                  format: "CAMPER: Gear = %s -> applying (Gen3)"
                  args: ['x.c_str()']
              - script.execute: apply_preset
            else:
              - text_sensor.template.publish:
                  id: preset_status
                  state: "Aborted - Disconnected"

# ============================================================
# BUTTONS
# ============================================================

button:
  # ---------- SYSTEM ----------
  - platform: restart
    name: "Reboot ESP32"
    entity_category: diagnostic

  # v2.0.0 - hard stop for a running preset (v4.4.5: also stops auto-level)
  - platform: template
    name: "Stop Preset"
    icon: mdi:stop-circle-outline
    on_press:
      - lambda: 'id(leveling_active) = false;'   # break the level loop first
      - script.stop: auto_level
      - script.stop: apply_preset
      - script.stop: full_dump
      - lambda: |-
          id(preset_applying) = false;
          id(preset_status).publish_state("Stopped by user");

  # v4.4.5 - AUTO LEVELING: one-button parked leveling. Stop via Stop Preset.
  - platform: template
    name: "Auto Level"
    icon: mdi:image-filter-center-focus
    on_press:
      - script.execute: auto_level

  - platform: template
    name: "Full Dump 0 psi"
    icon: mdi:arrow-collapse-down
    on_press:
      - script.execute: full_dump

  # ---------- IMU CALIBRATION ----------
  - platform: template
    name: "Calibrate Level Zero"
    icon: mdi:bullseye-arrow
    on_press:
      - lambda: |-
          // v4.4.2 - capture the current FUSED tilt as the level offset
          // (fused value already X-vertical + swap-aware, pre-invert).
          if (!id(fused_ready)) {
            ESP_LOGW("camper", "Calibrate pressed but IMU not ready - try again");
            return;
          }
          float raw_pitch = id(fused_pitch);
          float raw_roll  = id(fused_roll);
          id(pitch_offset) = raw_pitch;
          id(roll_offset)  = raw_roll;
          id(imu_pitch).publish_state(0.0f);
          id(imu_roll).publish_state(0.0f);
          ESP_LOGI("camper", "IMU calibrated: pitch_offset=%.2f roll_offset=%.2f", raw_pitch, raw_roll);

  - platform: template
    name: "Reset IMU Calibration"
    icon: mdi:restore
    entity_category: config
    disabled_by_default: true
    on_press:
      - lambda: |-
          id(pitch_offset) = 0.0f;
          id(roll_offset)  = 0.0f;
          id(imu_pitch).publish_state(NAN);
          id(imu_roll).publish_state(NAN);
          ESP_LOGI("camper", "IMU calibration cleared");

  - platform: template
    name: "Status Request"
    entity_category: config
    disabled_by_default: true
    on_press:
      - script.execute: status_request

  # ---------- INDIVIDUAL CORNERS ----------
  - platform: template
    name: "Front Left Lower"
    icon: mdi:arrow-down
    entity_category: config
    on_press:
      - script.execute: pulse_fl_lower
      - delay: 500ms
      - script.execute: status_request

  - platform: template
    name: "Front Left Raise"
    icon: mdi:arrow-up
    entity_category: config
    on_press:
      - script.execute: pulse_fl_raise
      - delay: 500ms
      - script.execute: status_request

  - platform: template
    name: "Front Right Lower"
    icon: mdi:arrow-down
    entity_category: config
    on_press:
      - script.execute: pulse_fr_lower
      - delay: 500ms
      - script.execute: status_request

  - platform: template
    name: "Front Right Raise"
    icon: mdi:arrow-up
