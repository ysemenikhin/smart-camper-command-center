name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  lint:
    name: yaml lint + placeholder check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install yamllint
      - run: yamllint -c .yamllint.yml esphome packages dashboard themes .github
      - name: placeholder check
        run: |
          if git grep -nIE '([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}|\b192\.168\.[0-9]+\.[0-9]+\b|key: "[A-Za-z0-9+/]{40,}={0,2}"' -- ':!*.md' ':!esphome/secrets.yaml.example' | grep -v 'XX:XX:XX:XX:XX:XX'; then
            echo "Real-looking identifier found - replace it with !secret or a placeholder"; exit 1; fi

  esphome:
    name: esphome config (${{ matrix.config }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [relay-board.yaml, air-suspension-s3.yaml]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install esphome
      - name: dummy secrets from the example
        working-directory: esphome
        run: |
          cp secrets.yaml.example secrets.yaml
          # ESPHome rejects the example's placeholders on purpose; use throwaway values here.
          sed -i "s|REPLACE_WITH_BASE64_32_BYTES|$(openssl rand -base64 32)|g" secrets.yaml
          sed -i "s/^manifold_mac: .*/manifold_mac: \"$(python3 -c "print(':'.join(['02','00','00','00','00','01']))")\"/" secrets.yaml
      - name: validate
        working-directory: esphome
        run: esphome config ${{ matrix.config }} > /dev/null
