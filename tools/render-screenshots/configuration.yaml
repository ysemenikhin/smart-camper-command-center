# Minimal HA config used only to render the documentation screenshots.
homeassistant:
  name: Smart Camper
  unit_system: metric
  time_zone: UTC
  latitude: 0
  longitude: 0
  elevation: 1180
http:
  server_port: 8123
api:
websocket_api:
recorder:
history:
frontend:
  themes: !include_dir_merge_named themes
lovelace:
  mode: yaml
  resources:
    - url: /local/community/button-card.js
      type: module
    - url: /local/community/card-mod.js
      type: module
    - url: /local/community/apexcharts-card.js
      type: module
