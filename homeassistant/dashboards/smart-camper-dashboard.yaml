                        type: area
                        stroke_width: 2
                        color: "#3aa6dd"
                        opacity: 0.25
          - type: grid
            columns: 3
            square: false
            cards:
              - type: custom:button-card
                template: arc_gauge
                entity: sensor.mppt_1_440w_current_solar_watts
                variables:
                  label: MPPT 1 - 440W
                  unit: W
                  max: 490
                  color: solar
                  amp_entity: sensor.mppt_1_440w_aux_battery_charging_ampers
                  size: 200
              - type: custom:button-card
                template: arc_gauge
                entity: sensor.mppt_2_880w_current_solar_watts
                variables:
                  label: MPPT 2 - 880W
                  unit: W
                  max: 600
                  color: solar
                  amp_entity: sensor.mppt_2_880w_aux_battery_charging_ampers
                  size: 200
              - type: custom:button-card
                template: arc_gauge
                entity: sensor.camper_solar_power
                variables:
                  label: Solar Total
                  unit: W
                  max: 1090
                  color: solar
                  size: 200
                  sub: solar
                  amp_entity:
                    - sensor.mppt_1_440w_aux_battery_charging_ampers
                    - sensor.mppt_2_880w_aux_battery_charging_ampers
          - type: horizontal-stack
            cards:
              - type: entities
                title: Battery Bank 1 (460 Ah)
                entities:
                  - sensor.battery_1_battery
                  - sensor.battery_1_voltage
                  - sensor.battery_1_current
                  # v206 - bank power, straight from the BMS
                  - entity: sensor.battery_1_power
                    name: Battery 1 Power
                  - sensor.battery_1_temperature
                  - entity: sensor.battery_1_stored_energy
                    name: Battery 1 Stored Energy
                  - binary_sensor.battery_1_problem
              - type: entities
                title: Battery Bank 2 (460 Ah)
                entities:
                  - sensor.battery_2_battery
                  - sensor.battery_2_voltage
                  - sensor.battery_2_current
                  # v206 - bank power, straight from the BMS
                  - entity: sensor.battery_2_power
                    name: Battery 2 Power
                  - sensor.battery_2_temperature
                  - entity: sensor.battery_2_stored_energy
                    name: Battery 2 Stored Energy
                  - binary_sensor.battery_2_problem
  # VIEW 3 - Lighting: interior + exterior light relays (KC868 relays) and
