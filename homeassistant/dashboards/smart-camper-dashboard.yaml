                {% endfor %}
          - type: grid
            columns: 3
            square: false
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:button-card
                    template: volt_card
                    entity: sensor.camper_battery_voltage
                    name: Voltage
                  - type: custom:button-card
                    template: time_box
                  - type: custom:apexcharts-card
