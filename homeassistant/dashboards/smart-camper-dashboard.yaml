                        - height: 64px
                        - padding: 0px
                      grid:
                        - grid-template-areas: '"i n"'
                        - grid-template-columns: auto auto
                        - justify-content: center
                        - align-items: center
                        - column-gap: 8px
                      img_cell:
                        - width: 43px
                        - min-width: 43px
                        - height: 43px
                        - overflow: visible
                      icon:
                        - width: 43px
                        - height: 43px
                        - "--mdc-icon-size": 43px
              - type: vertical-stack
                cards:
                  - type: picture-entity
                    entity: camera.front_cam_sub_stream
                    name: Front Camera
                    camera_view: live
                    show_state: false
                    aspect_ratio: "20:9"
                    # grid runs the LOW-RES sub-stream (all 4 live at once);
                    # tapping opens the FULL-RES main stream for this camera.
                    tap_action:
                      action: more-info
                      entity: camera.front_cam
                    hold_action:
                      action: more-info
                      entity: camera.front_cam
                  - type: custom:button-card
                    template: panel_button
                    entity: switch.relay_board_front_outdoor
                    name: Front
                    icon: mdi:car-light-high
                    # v190 - THE actual reason these boxes looked icon-less.
                    # panel_button carries "size: 34%", and button-card's size
