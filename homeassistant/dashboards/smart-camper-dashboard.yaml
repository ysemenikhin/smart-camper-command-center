                      action: more-info
                      entity: camera.rear_cam
                  - type: custom:button-card
                    template: scene_button
                    entity: binary_sensor.camper_scene_all_on
                    name: All Lights
                    icon: mdi:lightbulb-group
                    variables:
                      script: camper_all_lights_toggle
                    # v190 - THE actual reason these boxes looked icon-less.
                    # panel_button carries "size: 34%", and button-card's size
