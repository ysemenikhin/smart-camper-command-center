          # ---- v178: SETTINGS LOCK ----
          # HA cannot put a confirmation on a slider row - confirmations are a
          # tap_action feature and dragging is not a tap. So the popup lives
          # here, on the unlock button, and the cards below are made inert
          # while locked rather than hidden: every value stays readable, you
          # just cannot move anything by accident on the tablet.
          - type: custom:button-card
            # v196 - this card now points at the COUNTDOWN SENSOR, not at the
            # input_boolean. The v181 arrangement computed the time in the
            # browser from entity.last_changed and leaned on triggers_update
            # to force a redraw; it froze at "5:02" - it was not re-rendering,
            # and 5:02 is above the 5:00 maximum because the tablet clock runs
            # a couple of seconds behind the server.
            # A button-card always re-renders when its OWN entity changes, so
            # taking the state from a sensor that ticks server-side removes
            # both faults. The sensor reads "LOCKED" or "M:SS".
            # tap_action still names the input_boolean explicitly, so the
            # button keeps switching the right thing.
            entity: sensor.camper_settings_unlock_countdown
            show_state: false
            name: |
              [[[
                return entity.state === 'LOCKED'
                  ? 'SETTINGS LOCKED — TAP TO UNLOCK'
                  : 'UNLOCKED — ' + entity.state;
              ]]]
            icon: |
              [[[ return entity.state === 'LOCKED' ? 'mdi:lock' : 'mdi:lock-open-variant'; ]]]
            # v181 - amber blink for the whole time it is open, so an unlocked
            # panel is impossible to miss from across the cab.
            card_mod:
              style: |
                @keyframes camper-unlock-blink {
                  0%, 100% { opacity: 1; }
                  50%      { opacity: 0.4; }
                }
                ha-card {
                  animation: {% if is_state('input_boolean.camper_settings_unlock','on')
                    %}camper-unlock-blink 1.1s ease-in-out infinite{% else %}none{% endif %};
                }
            tap_action:
              action: call-service
              service: input_boolean.toggle
              service_data: {entity_id: input_boolean.camper_settings_unlock}
              confirmation:
                text: >-
                  Unlock the suspension settings? These set the pressure
                  limits and how Auto-Level behaves. They relock after 5
                  minutes.
            styles:
              card:
                # v182 - 34 -> 51px (+50%).
                - height: 51px
                - padding: 0 8px
                - background: "linear-gradient(160deg, #1c242c, #11171d)"
                # v181 - red while locked, AMBER while open (was green in
                # v180) to go with the blink.
                - border: |
                    [[[ return entity.state === 'LOCKED'
                        ? '1px solid rgba(224,82,82,0.55)'
                        : '1px solid rgba(232,163,61,0.65)'; ]]]
              # v181 - icon and text centred as a pair instead of pinned left.
              grid:
                - grid-template-areas: '"i n"'
                - grid-template-columns: min-content min-content
                - justify-content: center
                - align-items: center
                - column-gap: 8px
              icon:
                - width: 19px
                - color: "[[[ return entity.state === 'LOCKED' ? '#e05252' : '#e8a33d'; ]]]"
              name:
                # v181 - 1.5x the old clamp(11px, 1vw, 14px).
                - justify-self: center
                - font-size: clamp(16px, 1.5vw, 21px)
                # v182 - bolder.
                - font-weight: "700"
                - line-height: 1
                - letter-spacing: 1px
                - white-space: nowrap
                - color: "[[[ return entity.state === 'LOCKED' ? '#e05252' : '#e8a33d'; ]]]"
          - type: entities
            title: Suspension Settings
            show_header_toggle: false
            card_mod:
              style: |
                ha-card {
                  pointer-events: {% if is_state('input_boolean.camper_settings_unlock','on') %}auto{% else %}none{% endif %};
                  opacity: {% if is_state('input_boolean.camper_settings_unlock','on') %}1{% else %}0.55{% endif %};
                  border: 1px solid {% if is_state('input_boolean.camper_settings_unlock','on') %}rgba(232,163,61,0.55){% else %}transparent{% endif %};
                }
            entities:
              - entity: select.camper_air_suspension_gear
                name: 'Suspension mode (applies on select)'
              - binary_sensor.camper_air_suspension_manifold_connected
              - entity: number.camper_air_suspension_level_threshold
                name: 'Level Threshold — how flat Auto-Level finishes (deg; lower = fussier)'
              - entity: number.camper_air_suspension_preset_height_deadband
                name: 'Height Deadband — hold within this % of the mode target (bigger = calmer)'
              - entity: number.camper_air_suspension_preset_psi_deadband
                name: 'PSI Deadband — hold within this psi (used only in PSI mode)'
              - entity: input_number.camper_balance_threshold
                name: 'Balance Threshold — display only (the stance Δ text), not control'
              - entity: number.camper_air_suspension_max_corner_psi
                name: 'Max Corner PSI — inflate ceiling per bag'
              - entity: number.camper_air_suspension_min_corner_psi
                name: 'Min Corner PSI — deflate floor per bag'
              - entity: number.camper_air_suspension_emergency_cap_psi
                name: 'Emergency Cap PSI — hard overpressure cutoff'
              - sensor.camper_air_suspension_front_jack_advice
          # HEIGHT preset set - shown when Preset Mode = Height (switch OFF)
          - type: conditional
            conditions:
              - entity: switch.camper_air_suspension_preset_mode_psi
                state_not: 'on'
            card:
              type: entities
              title: Suspension Mode Presets
              show_header_toggle: false
              card_mod:
                style: |
                  ha-card {
                    pointer-events: {% if is_state('input_boolean.camper_settings_unlock','on') %}auto{% else %}none{% endif %};
                    opacity: {% if is_state('input_boolean.camper_settings_unlock','on') %}1{% else %}0.55{% endif %};
                    border: 1px solid {% if is_state('input_boolean.camper_settings_unlock','on') %}rgba(232,163,61,0.55){% else %}transparent{% endif %};
                  }
              entities:
                - number.camper_air_suspension_parked_front_height
                - number.camper_air_suspension_parked_rear_height
                - number.camper_air_suspension_highway_normal_front_height
                - number.camper_air_suspension_highway_normal_rear_height
                - number.camper_air_suspension_highway_heavy_front_height
                - number.camper_air_suspension_highway_heavy_rear_height
                - number.camper_air_suspension_off_road_front_height
                - number.camper_air_suspension_off_road_rear_height
                - number.camper_air_suspension_easy_maneuver_front_height
                - number.camper_air_suspension_easy_maneuver_rear_height
          # PSI preset set - same section, shown when Preset Mode = PSI (switch ON)
          - type: conditional
            conditions:
              - entity: switch.camper_air_suspension_preset_mode_psi
                state: 'on'
            card:
              type: entities
              title: Suspension Mode Presets  (PSI fallback)
              show_header_toggle: false
              card_mod:
                style: |
                  ha-card {
                    pointer-events: {% if is_state('input_boolean.camper_settings_unlock','on') %}auto{% else %}none{% endif %};
                    opacity: {% if is_state('input_boolean.camper_settings_unlock','on') %}1{% else %}0.55{% endif %};
                    border: 1px solid {% if is_state('input_boolean.camper_settings_unlock','on') %}rgba(232,163,61,0.55){% else %}transparent{% endif %};
                  }
              entities:
                - number.camper_air_suspension_parked_front_psi
                - number.camper_air_suspension_parked_rear_psi
                - number.camper_air_suspension_highway_normal_front_psi
                - number.camper_air_suspension_highway_normal_rear_psi
                - number.camper_air_suspension_highway_heavy_front_psi
                - number.camper_air_suspension_highway_heavy_rear_psi
                - number.camper_air_suspension_off_road_front_psi
                - number.camper_air_suspension_off_road_rear_psi
                - number.camper_air_suspension_easy_maneuver_front_psi
                - number.camper_air_suspension_easy_maneuver_rear_psi
          # Preset Mode tile - centered, one line; WHOLE BOX amber in PSI (emergency).
          - type: custom:button-card
            entity: switch.camper_air_suspension_preset_mode_psi
            show_icon: true
            show_name: true
            show_state: false
            icon: mdi:swap-horizontal-bold
            name: "[[[ return entity.state==='on' ? 'PRESET MODE:  PSI  (EMERGENCY)' : 'PRESET MODE:  Height %'; ]]]"
            tap_action:
              action: toggle
              confirmation:
                text: >-
                  PSI FALLBACK MODE - safe to drive. Suspension presets and
                  Auto-Maintain will adjust the suspension by air-bag PSI instead of
                  the Height Sensors (use if a Height Sensor has failed). Set targets
                  in PSI. Switch now?
            styles:
              card:
                - height: 46px
                - padding: '6px 14px'
                - border-radius: 10px
                - margin-top: 6px
                - border: "[[[ return entity.state==='on' ? '1px solid #e8a33d' : '1px solid #2a333c'; ]]]"
                - background: "[[[ return entity.state==='on' ? 'linear-gradient(160deg,#4a3410,#2c1f07)' : 'linear-gradient(160deg,#1c242c,#11171d)'; ]]]"
                - box-shadow: "[[[ return entity.state==='on' ? '0 0 14px rgba(232,163,61,0.35)' : 'none'; ]]]"
              grid:
                - grid-template-areas: '"i n"'
                - grid-template-columns: auto auto
                - justify-content: center
                - column-gap: 8px
                - align-items: center
              icon:
                - width: 22px
                - color: "[[[ return entity.state==='on' ? '#e8a33d' : '#3aa6dd'; ]]]"
              name:
                - font-size: 13px
                - font-weight: 700
                - letter-spacing: 0.5px
                - color: "[[[ return entity.state==='on' ? '#e8a33d' : '#e8edf2'; ]]]"
  # VIEW 7 - Cameras (v68): fixed 16:9 tiles (size never changes with stream
  # state), lights in their own row under each relevant camera.
  - title: Cameras
    path: cameras
    icon: mdi:cctv
    type: panel
    cards:
      - type: vertical-stack
        cards:
          # ---- GLOBAL ALERTS (v153) ----
          # Identical on all 8 tabs. Every condition is defined ONCE in
          # sensor.camper_alert_summary (package v40); this just prints it,
          # so alerts raised on any tab are visible from whichever tab you are
          # on. Wrapped in a conditional so it takes zero height when clear.
          - type: conditional
            conditions:
              - entity: binary_sensor.camper_any_alert
                state: "on"
            card:
              type: markdown
              content: |-
                {% for l in state_attr('sensor.camper_alert_summary','lines') or [] %}{{ l }}

                {% endfor %}
          # v170 - 5 columns -> 2. At 5-across each feed was about a fifth of
          # the panel width and unreadable. Two columns gives roughly 2.5x the
          # width per camera: Left/Right on the first row, Rear/Front on the
          # second, Interior on a third.
          #
          # v184 - the light buttons used to sit in their own row underneath,
          # which meant scrolling to reach them. Each light now lives in a
          # vertical-stack directly under the camera it lights, so you press
          # the button while looking at that view. Rear and Interior have no
          # light wired, so those two cells are camera-only.
          #
          # v185 - the four exterior feeds go 16:9 -> 5:2. At 2 columns on the
          # 1340x800 tablet each cell is ~658px wide, so 16:9 made them 370px
          # tall and the second row's button fell off the screen. Interior
          # stays 16:9 - it is on the third row and scrolls anyway, and
          # cropping the cabin view helps nothing. The buttons took the plain
          # Lighting-tab panel_button, 86px.
          #
          # v186 - that split the space the wrong way. Buttons drop 86 -> 44px
          # and the cameras take what they give up: 5:2 (263px) -> 20:9
          # (296px). Per row that is 296 + 44 + 8 = 348px, so two rows land at
          # ~696px - inside the ~700px this tablet actually leaves below the
          # toolbar (see the 768px measurement in panel_button above). The
          # buttons keep the Lighting tab's colours, icons and names; only
          # their height differs, and panel_button's icon is sized in percent
          # so it scales down with the box on its own.
          - type: grid
            columns: 2
            square: false
            cards:
              - type: vertical-stack
                cards:
                  - type: picture-entity
                    entity: camera.left_cam_sub_stream
                    name: Left Camera
                    camera_view: live
                    show_state: false
                    aspect_ratio: "20:9"
                    # grid runs the LOW-RES sub-stream (all 4 live at once);
                    # tapping opens the FULL-RES main stream for this camera.
                    tap_action:
                      action: more-info
                      entity: camera.left_cam
                    hold_action:
                      action: more-info
                      entity: camera.left_cam
                  - type: custom:button-card
                    template: panel_button
                    entity: switch.relay_board_outdoor_left
                    name: Left
                    icon: mdi:light-flood-down
                    # v190 - THE actual reason these boxes looked icon-less.
                    # panel_button carries "size: 34%", and button-card's size
                    # is a percentage of the CARD, not of the row. These cells
                    # are ~658px wide, so 34% asked for a ~220px icon inside a
                    # 44px-tall box - it simply had nowhere to draw. v189's
                    # styles.icon width only resized the wrapper around it,
                    # which is why nothing changed. size: 20px is the knob that
                    # actually sets the glyph. The side-by-side layout from
                    # v189 stays. Icons are unchanged - the same mdi ones the
                    # Lighting tab uses.
                    # v191 - found by inspecting the rendered card in the
                    # browser. button-card puts the icon inside #img-cell,
                    # which is "overflow: hidden" and was computing to 0px
                    # wide in this layout - the glyph existed but was clipped
                    # to nothing, which is why size: 20px (v190) and the icon
                    # wrapper width (v189) both changed nothing. Sizing
                    # img_cell itself is what makes it appear; confirmed live
                    # on the Cameras tab before writing this. --mdc-icon-size
                    # is set explicitly too, because it was inheriting 100%,
                    # which resolves against a zero-height box.
                    # v202 - 43px = Lighting icon size (measured, see header)
                    size: 43px
                    styles:
                      card:
                        # v204 - 64px = the box height before v203 (measured);
                        # padding 0 so icon+text are centred inside it.
                        - height: 64px
                        - padding: 0px
                      grid:
                        - grid-template-areas: '"i n"'
                        - grid-template-columns: auto auto
                        - justify-content: center
                        - align-items: center
                        - column-gap: 8px
                      img_cell:
                        - width: 43px
                        - min-width: 43px
                        - height: 43px
                        - overflow: visible
                      icon:
                        - width: 43px
                        - height: 43px
                        - "--mdc-icon-size": 43px
              - type: vertical-stack
                cards:
                  - type: picture-entity
                    entity: camera.right_cam_sub_stream
                    name: Right Camera
                    camera_view: live
                    show_state: false
                    aspect_ratio: "20:9"
                    # grid runs the LOW-RES sub-stream (all 4 live at once);
                    # tapping opens the FULL-RES main stream for this camera.
                    tap_action:
                      action: more-info
                      entity: camera.right_cam
                    hold_action:
                      action: more-info
                      entity: camera.right_cam
                  - type: custom:button-card
                    template: panel_button
                    entity: switch.relay_board_outdoor_right
                    name: Right
                    icon: mdi:light-flood-down
                    # v190 - THE actual reason these boxes looked icon-less.
