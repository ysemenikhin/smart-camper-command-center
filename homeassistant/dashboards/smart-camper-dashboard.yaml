              # stay available to automations.
              - type: custom:button-card
                template: scene_button
                entity: binary_sensor.camper_scene_all_on
                name: All Lights
                icon: mdi:lightbulb-group
                variables:
                  script: camper_all_lights_toggle
              - type: custom:button-card
                template: scene_button
                entity: binary_sensor.camper_scene_exterior_on
                name: Exterior On
                icon: mdi:lightbulb-group
                variables:
                  script: camper_exterior_lights_on
              - type: custom:button-card
                template: scene_button
                entity: binary_sensor.camper_scene_night_mode
                name: Night Mode
                icon: mdi:weather-night
                variables:
                  script: camper_night_mode
                  on_color: "#e05252"
              - type: custom:button-card
                template: scene_button
                entity: binary_sensor.camper_scene_stealth
                name: Stealth Mode
                icon: mdi:incognito
                variables:
                  script: camper_stealth_mode
                  on_color: "#e05252"
              # v205 - entity is the LOOP script, so the tile glows exactly
              # while flashing; the tap goes to the toggle wrapper, which
              # stops the loop and leaves both lights off.
              - type: custom:button-card
                template: scene_button
                entity: script.camper_police_lights
                name: Police
                icon: mdi:alarm-light
                variables:
                  script: camper_police_toggle
                  on_color: "#3aa6dd"
              # v205 - one tap = 3 flashes of Front Outdoor, then off.
              - type: custom:button-card
                template: scene_button
                entity: script.camper_front_flash
                name: Front Flash
                icon: mdi:car-light-high
                variables:
                  script: camper_front_flash
          - type: grid
            columns: 5
            square: false
            title: Appliances
            card_mod:
              style: |
                h1.card-header {
                  font-size: 15px !important;
                  font-weight: 600 !important;
                  padding: 10px 8px 2px 8px !important;
                  line-height: 1.2 !important;
                  color: #93a1ac !important;
                  text-transform: uppercase;
                  letter-spacing: 1.5px;
                }
            cards:
              - type: custom:button-card
                template: panel_button
                entity: switch.relay_board_water_pump
                name: Water Pump
                icon: mdi:water-pump
                variables:
                  on_color: "#3aa6dd"
              - type: custom:button-card
                template: panel_button
                entity: switch.relay_board_fan
                name: Fan
                icon: mdi:fan
                variables:
                  on_color: "#3aa6dd"
              - type: custom:button-card
                template: panel_button
                entity: switch.relay_board_inverter
                name: Inverter 220V
                icon: mdi:current-ac
                variables:
                  on_color: "#e8a33d"
                tap_action:
                  action: toggle
                  confirmation:
                    text: Switch the inverter? This is a large AC load.
              - type: custom:button-card
                template: panel_button
                entity: switch.relay_board_water_gauges
                name: Water Gauges
                icon: mdi:gauge
                variables:
                  on_color: "#e05252"
              - type: custom:button-card
                template: panel_button
                entity: switch.diesel_heater_power
                name: Diesel Heater
                icon: mdi:radiator
                variables:
                  on_color: "#e8a33d"
              # v156 - Stabilisers (RE15). SIX tiles in a 5-column grid, so it
              # wraps onto its own row. Left at 5 columns deliberately: every
              # other grid on this tab is 5, and changing it would make these
              # boxes a different size from the rest - the exact mismatch v154
              # was spent removing.
              - type: custom:button-card
                template: panel_button
                entity: switch.relay_board_stabilisers
                name: Stabilisers
                icon: mdi:screw-lag
                variables:
                  on_color: "#e05252"
              # v167 - Steps (RE13). Split onto its own relay in firmware
              # v2.2.0 so it can stay live while camped for the door reed,
              # unlike Stabilisers which cuts out after 10 minutes. Blue, not
              # red: this is the low-risk load that is MEANT to stay on.
              - type: custom:button-card
                template: panel_button
                entity: switch.relay_board_steps
                name: Steps
                icon: mdi:stairs
                variables:
                  on_color: "#e8a33d"
              # v168 - Tank & Pipe Heater (RE16). NOTHING IS WIRED TO THIS YET
              # - the relay exists and will switch, but no heater is connected,
              # so pressing it currently does nothing visible. Amber to match
              # the Diesel Heater, since both are heating loads.
              - type: custom:button-card
                template: panel_button
                entity: switch.relay_board_tank_pipe_heater
                name: Tank & Pipe Heat
                icon: mdi:snowflake-melt
                variables:
                  on_color: "#e05252"
  - title: Water
    path: water
    icon: mdi:water
    type: panel
    cards:
      - type: vertical-stack
        cards:
          # ---- GLOBAL ALERTS (v153) ----
          # Identical on all 8 tabs. Every condition is defined ONCE in
          # sensor.camper_alert_summary (package v40); this just prints it,
          # so alerts raised on any tab are visible from whichever tab you are
          # on. Wrapped in a conditional so it takes zero height when clear.
          - type: conditional
            conditions:
              - entity: binary_sensor.camper_any_alert
                state: "on"
            card:
              type: markdown
              content: |-
                {% for l in state_attr('sensor.camper_alert_summary','lines') or [] %}{{ l }}

                {% endfor %}
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                template: arc_gauge
                entity: sensor.clear_water_tank
                variables:
                  label: Clear Water
                  color: "#3aa6dd"
                  ef: true
                  sub: tank
                  lit_entity: sensor.clear_water_litres
                  cap: 280
              - type: custom:button-card
                template: arc_gauge
                entity: sensor.gray_water_tank
                variables:
                  label: Gray Water
                  color: "#6fae9d"
                  ef: true
                  sub: tank
                  lit_entity: sensor.gray_water_litres
                  cap: 100
          # v197 - row 2: tank + pipe temperatures (DS18B20, relay-board v2.3.3)
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:button-card
                template: water_temp
                entity: sensor.relay_board_clean_water_tank_temp
                name: Clean Water Tank Temp
              - type: custom:button-card
                template: water_temp
                entity: sensor.relay_board_grey_water_tank_temp
                name: Grey Water Tank Temp
              - type: custom:button-card
                template: water_temp
                entity: sensor.relay_board_water_pipe_1_temp
                name: Water Pipe 1 Temp
              - type: custom:button-card
                template: water_temp
                entity: sensor.relay_board_water_pipe_2_temp
                name: Water Pipe 2 Temp
          # v197 - row 3: the same two tiles as on the Lighting tab.
          # v201 - 2 columns, each tile half the row. Each tile's padding
          # shrinks its content box to a Lighting tile's, so icon and text
          # come out identical. Keep that padding if these tiles are copied.
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                template: panel_button
                entity: switch.relay_board_water_pump
                name: Water Pump
                icon: mdi:water-pump
                # v201 - same content box as a Lighting tile (maths in header)
                styles:
                  card:
                    - padding: calc(1.6% - 0.2px) calc(30% + 2.4px)
                variables:
                  on_color: "#3aa6dd"
              - type: custom:button-card
                template: panel_button
                entity: switch.relay_board_tank_pipe_heater
                name: Tank & Pipe Heat
                icon: mdi:snowflake-melt
                # v201 - same content box as a Lighting tile (maths in header)
                styles:
                  card:
                    - padding: calc(1.6% - 0.2px) calc(30% + 2.4px)
                variables:
                  on_color: "#e05252"
          # v146 removed three heating-cable buttons here (they pointed at
          # RE14/RE15/RE16; RE14 is the WATER GAUGES and RE15/16 are spare, so
          # "Clear Tank Heater" would have switched the gauges off). v149
          # removes the now-empty grid card they left behind - a grid with no
          # cards: key renders as an error card in HA.
          # v150: placeholder markdown + slider card removed entirely.
  # VIEW 6 - Suspension: per-corner PSI + raise/lower, ROLL/PITCH dials,
  # mode presets, balance/stance, air tank, manifold/BLE/offroad,
  # axle+side nudges, settings, and editable mode target HEIGHTS (%).
  - title: Climate
    path: climate
    icon: mdi:thermostat
    type: panel
    cards:
      - type: vertical-stack
        cards:
          # ---- GLOBAL ALERTS (v153) ----
          # Identical on all 8 tabs. Every condition is defined ONCE in
          # sensor.camper_alert_summary (package v40); this just prints it,
          # so alerts raised on any tab are visible from whichever tab you are
          # on. Wrapped in a conditional so it takes zero height when clear.
          - type: conditional
            conditions:
              - entity: binary_sensor.camper_any_alert
                state: "on"
            card:
              type: markdown
              content: |-
                {% for l in state_attr('sensor.camper_alert_summary','lines') or [] %}{{ l }}

                {% endfor %}
          - type: grid
            columns: 3
            square: false
            cards:
              # v154 - stripped back to a PLAIN arc_gauge, exactly like the
              # gauges on Home / Water / Energy. No size, no card styles, no
              # grid override, no spacer row. See the v154 note in the header
              # for why all of that had to go.
              - type: custom:button-card
                template: arc_gauge
                entity: sensor.diesel_heater_interior_temperature
                variables:
                  label: Room Temp
                  unit: °C
                  min: -10
                  max: 40
                  color: roomtemp
                  decimals: 1
              - type: vertical-stack
                cards:
                  - type: conditional
                    conditions:
                      - entity: select.diesel_heater_running_mode
                        state: Temperature
                    card:
                      type: thermostat
                      entity: climate.diesel_heater
                  - type: conditional
                    conditions:
                      - entity: select.diesel_heater_running_mode
                        state_not: Temperature
                    card:
                      type: grid
                      columns: 2
                      square: false
                      cards:
                          - type: custom:button-card
                            template: heat_level_key
                            name: "1"
                            variables:
                              level: 1
                          - type: custom:button-card
                            template: heat_level_key
                            name: "6"
                            variables:
                              level: 6
                          - type: custom:button-card
                            template: heat_level_key
                            name: "2"
                            variables:
                              level: 2
                          - type: custom:button-card
                            template: heat_level_key
                            name: "7"
                            variables:
                              level: 7
                          - type: custom:button-card
                            template: heat_level_key
                            name: "3"
                            variables:
                              level: 3
                          - type: custom:button-card
                            template: heat_level_key
                            name: "8"
                            variables:
                              level: 8
                          - type: custom:button-card
                            template: heat_level_key
                            name: "4"
                            variables:
                              level: 4
                          - type: custom:button-card
                            template: heat_level_key
                            name: "9"
                            variables:
                              level: 9
                          - type: custom:button-card
                            template: heat_level_key
                            name: "5"
                            variables:
                              level: 5
                          - type: custom:button-card
                            template: heat_level_key
                            name: "10"
                            variables:
                              level: 10
              - type: custom:button-card
                template: fuel_gauge
                entity: sensor.camper_fuel_remaining_percent
                variables:
                  label: Fuel Tank
                  unit: "%"
                  color: auto
                  decimals: 0
                  sub: fuel
          - type: grid
            columns: 4
            square: false
            cards:
              # v136 - standalone card (not panel_button): a plain power icon and
              # the WHOLE box lights up when the heater is on, so its state is
              # obvious at a glance rather than a small coloured icon.
              - type: custom:button-card
                entity: switch.diesel_heater_power
                show_icon: true
                show_name: true
                show_state: false
                icon: mdi:power
                name: Heater Power
                size: 36%
                tap_action:
                  action: toggle
                  confirmation:
                    text: Turn the diesel heater on / off?
                hold_action:
                  action: more-info
                styles:
                  card:
                    - height: 86px
                    - border-radius: 12px
                    - background: >-
                        [[[ return entity.state === 'on'
                            ? 'linear-gradient(160deg,#f0ae47,#c9791a)'
                            : 'linear-gradient(160deg,#1c242c,#11171d)'; ]]]
                    - border: >-
                        [[[ return entity.state === 'on'
                            ? '1px solid #ffc46b' : '1px solid #2a333c'; ]]]
                    - box-shadow: >-
                        [[[ return entity.state === 'on'
                            ? '0 0 24px rgba(232,163,61,0.55)' : 'none'; ]]]
                  icon:
                    - color: >-
                        [[[ return entity.state === 'on' ? '#2a1a05' : '#7e8b96'; ]]]
                  name:
                    - font-size: clamp(11px, 1vw, 14px)
                    - letter-spacing: 0.5px
                    - font-weight: 700
                    - color: >-
                        [[[ return entity.state === 'on' ? '#2a1a05' : '#93a1ac'; ]]]
              - type: custom:button-card
                template: climate_stat
                entity: select.diesel_heater_running_mode
                name: Mode — tap to change
                variables:
                  font: 15px
                state_display: >-
                  [[[ return entity.state === 'Temperature' ? 'Thermostat' : entity.state; ]]]
                tap_action:
                  action: call-service
                  service: script.camper_heater_set_mode
                  service_data:
                    mode: >-
                      [[[ return entity.state === 'Temperature' ? 'Level' : 'Temperature'; ]]]
                  confirmation:
                    text: >-
                      [[[ return entity.state === 'Temperature'
                          ? 'Switch to LEVEL mode? The heater will run at a fixed gear instead of holding a temperature.'
                          : 'Switch to THERMOSTAT mode? The heater will hold the target temperature automatically.'; ]]]
                styles:
                  card:
                    - border: 1px solid rgba(58,166,221,0.45)
                  state:
                    - color: "#3aa6dd"
              - type: custom:button-card
                template: panel_button
                entity: switch.diesel_heater_auto_start_stop
                name: Auto Start/Stop
                icon: mdi:autorenew
                variables:
                  on_color: "#3aa6dd"
              - type: custom:button-card
                template: panel_button
                entity: switch.diesel_heater_timer
                name: Timer
                icon: mdi:timer-outline
                variables:
                  on_color: "#3aa6dd"
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:button-card
                template: climate_stat
                entity: sensor.diesel_heater_running_step
                name: Heater State
                variables:
                  font: 15px
                styles:
                  state:
                    - color: |
                        [[[
                          const s = (entity.state || '').toLowerCase();
                          if (s.indexOf('standby') >= 0 || s.indexOf('off') >= 0) return '#5c6a75';
                          if (s.indexOf('ignit') >= 0 || s.indexOf('start') >= 0 || s.indexOf('self') >= 0 ||
