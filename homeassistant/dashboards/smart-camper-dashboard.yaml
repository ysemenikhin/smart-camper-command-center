                icon: mdi:radiator
                variables:
                  on_color: "#e8a33d"
  # VIEW 2 - Energy: voltage, time-left, Battery-24h chart, SOC gauge,
  # ENERGY box (+Load line), stored energy, Solar-24h chart,
