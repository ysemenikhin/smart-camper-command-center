              - type: custom:button-card
                template: panel_button
                entity: switch.relay_board_bedroom_light
                name: Bedroom
                icon: mdi:lamp
              - type: custom:button-card
                template: panel_button
                entity: switch.relay_board_main_bedroom_red
                name: Main Bedroom Red
                icon: mdi:lightbulb-night
                variables:
                  on_color: "#e05252"
          - type: grid
            columns: 5
            square: false
            title: Exterior
            card_mod:
              style: |
                h1.card-header {
                  font-size: 15px !important;
                  font-weight: 600 !important;
                  padding: 10px 8px 2px 8px !important;
                  line-height: 1.2 !important;
                  color: #93a1ac !important;
                  text-transform: uppercase;
                  letter-spacing: 1.5px;
                }
            cards:
              # v173 - order matches the trailer: left spot, front bar, right
