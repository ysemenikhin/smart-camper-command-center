                name: Left
                icon: mdi:light-flood-down
              - type: custom:button-card
                template: panel_button
                entity: switch.relay_board_front_outdoor
                name: Front
                icon: mdi:car-light-high
              - type: custom:button-card
                template: panel_button
                entity: switch.relay_board_outdoor_right
                name: Right
                icon: mdi:light-flood-down
              - type: custom:button-card
                template: panel_button
                entity: switch.relay_board_awning_red_left
                name: Awning L Red
                icon: mdi:awning-outline
                variables:
                  on_color: "#e05252"
              - type: custom:button-card
                template: panel_button
                entity: switch.relay_board_awning_red_right
                name: Awning R Red
                icon: mdi:awning-outline
                variables:
                  on_color: "#e05252"
          - type: grid
            columns: 5
            square: false
            title: Scenes
            card_mod:
              style: |
                h1.card-header {
                  font-size: 15px !important;
                  font-weight: 600 !important;
                  padding: 10px 8px 2px 8px !important;
                  line-height: 1.2 !important;
                  color: #93a1ac !important;
                  text-transform: uppercase;
                  letter-spacing: 1.5px;
                }
            cards:
              # v188 - the separate All On and All Off keys collapse into one,
              # matching every other tile on this dashboard: press it once for
