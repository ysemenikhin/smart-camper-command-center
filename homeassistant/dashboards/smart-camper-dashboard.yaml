  # ============================================================
  # VIEW 8 - Connectivity (v40): bigger QR + gauge, Starlink guarded, no Band.
  # ============================================================
  - title: Connectivity
    path: connectivity
    icon: mdi:web
    type: panel
    cards:
      - type: vertical-stack
        cards:
          # ---- GLOBAL ALERTS (v153) ----
          # Identical on all 8 tabs. Every condition is defined ONCE in
          # sensor.camper_alert_summary (package v40); this just prints it,
          # so alerts raised on any tab are visible from whichever tab you are
          # on. Wrapped in a conditional so it takes zero height when clear.
          - type: conditional
            conditions:
              - entity: binary_sensor.camper_any_alert
                state: "on"
            card:
              type: markdown
              content: |-
                {% for l in state_attr('sensor.camper_alert_summary','lines') or [] %}{{ l }}

                {% endfor %}
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:button-card
                tap_action: {action: none}
                styles:
                  card: [ {height: 150px}, {padding: 8px} ]
                  grid: [ {grid-template-areas: "\"qr\""} ]
                custom_fields:
                  qr: |
                    [[[
                      return `<div style="display:flex;align-items:center;gap:12px;height:100%;">
                        <img src="/local/wifi-qr.png" style="height:132px;width:132px;image-rendering:pixelated;">
                        <div style="text-align:left;"><div style="color:#e8edf2;font-weight:700;font-size:14px;">Smart Camper Command Center</div>
                        <div style="color:#93a1ac;font-size:11px;">Scan to join Wi-Fi</div></div></div>`;
                    ]]]
              - type: custom:button-card
                tap_action: {action: more-info, entity: sensor.camper_wan_mode}
                styles:
                  card: [ {height: 150px}, {padding: 4px} ]
                  grid: [ {grid-template-areas: "\"m\""} ]
                custom_fields:
                  m: |
                    [[[
                      const lbl = states['sensor.camper_wan_mode']?.state || '--';
                      const t = states['sensor.camper_wan_type']?.state;
                      const icon = t==='starlink'?'mdi:satellite-uplink':t==='repeater'?'mdi:wifi':t==='cellular'?'mdi:antenna':'mdi:wan';
                      const col = t==='offline'?'#e05252':t==='cellular'?'#76bf43':'#3aa6dd';
                      return `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:2px;">
                        <div style="display:flex;align-items:center;gap:7px;"><ha-icon icon="${icon}" style="color:${col};--mdc-icon-size:22px;"></ha-icon>
                        <span style="color:${col};font-weight:700;font-size:clamp(13px,1.2vw,18px);">${lbl}</span></div>
                        <div style="color:#93a1ac;font-size:9px;text-transform:uppercase;letter-spacing:1.5px;">WAN Mode</div></div>`;
                    ]]]
              - type: custom:button-card
                template: stat_card
                entity: binary_sensor.camper_internet
                name: Internet
                state_display: "[[[ if(!entity||['unavailable','unknown'].includes(entity.state)) return 'Add Ping'; return entity.state==='on'?'Online':'Offline'; ]]]"
                styles:
                  card: [ {height: 150px} ]
                  state: [ {color: "[[[ if(!entity||['unavailable','unknown'].includes(entity.state)) return '#5c6a75'; return entity.state==='on'?'#76bf43':'#e05252'; ]]]"} ]
              - type: custom:button-card
                template: stat_card
                entity: sensor.camper_wan_ip
                name: WAN IP
                styles: {card: [ {height: 150px} ], state: [ {font-size: "clamp(12px, 1vw, 16px)"} ]}
          # ---- ROW 2 (v165): four equal boxes, matching the four above.
          # Cellular dial | Provider | Download | Upload - each its own card,
          # so each opens its own history when tapped. They were previously
          # cells inside one lambda, which could only ever open a single
          # more-info dialog for the whole card.
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:button-card
                tap_action: {action: more-info, entity: sensor.camper_cell_signal}
                styles:
                  card: [ {height: 150px}, {padding: 6px} ]
                  grid: [ {grid-template-areas: "\"c\""} ]
                custom_fields:
                  c: |
                    [[[
                      // v160 - CELLULAR ONLY, and it now READS THE PACKAGE SENSORS.
                      // This block used to carry its own private copy of the signal
                      // maths, so package v47/v48 fixed sensor.camper_cell_signal
                      // while this gauge carried on computing its own answer - two
                      // sources of truth that silently disagreed. It also switched
                      // to the WI-FI repeater whenever repeating, which is why a
                      // -89 dBm Wi-Fi link made the whole tab read "Poor" while
                      // cellular was perfectly healthy.
                      // Percentage and rating now come straight from the package
                      // (RSRP 70% + SINR 30%); the dBm shown is RSRP, the real
                      // cellular power measure. Wi-Fi is not displayed here at all.
                      const bad = s => !s || ['unknown','unavailable','none',''].includes(s);
                      const pctS   = states['sensor.camper_cell_signal']?.state;
                      const ratS   = states['sensor.camper_cell_rating']?.state;
                      const rsrp   = parseFloat(states['sensor.gl_inet_x3000_cellular_rsrp']?.state);
                      const band   = states['sensor.gl_inet_x3000_cellular_band']?.state || '';
                      // v196 - WCDMA/HSPA added. The router had fallen back to
                      // 3G, which this list did not name, so the tile said only
                      // "Cell Signal" while every metric was missing - nothing
                      // on screen explained why.
                      const label  = band.includes('NR5G') ? '5G Signal'
                                   : band.includes('LTE')  ? '4G Signal'
                                   : (band.includes('WCDMA') || band.includes('HSPA')
                                      || band.includes('UMTS')) ? '3G Signal'
                                   : 'Cell Signal';
                      const ok     = !bad(pctS);
                      const pct    = ok ? Math.max(0, Math.min(100, parseFloat(pctS))) : 0;
                      const rating = bad(ratS) ? '--' : ratS;
                      const dbm    = rsrp;
                      const col = !ok ? '#5c6a75' : pct >= 50 ? '#76bf43' : pct >= 25 ? '#e8a33d' : '#e05252';
                      const A = 220, W = 280, r = 50, cc = 60;
                      const pt = a => { const t = (a - 90) * Math.PI / 180; return [cc + r * Math.cos(t), cc + r * Math.sin(t)]; };
                      const arc = (a, b, color, w) => { const [x0,y0]=pt(a),[x1,y1]=pt(b); return `<path d="M ${x0} ${y0} A ${r} ${r} 0 ${(b-a)>180?1:0} 1 ${x1} ${y1}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`; };
                      const svg = `<svg viewBox="0 0 120 120" style="height:138px;display:block;">${arc(A,A+W,'rgba(255,255,255,0.08)',7)}${ok?arc(A,A+W*pct/100,col,7):''}<text x="60" y="56" text-anchor="middle" fill="var(--primary-text-color)" font-size="17" font-weight="700">${rating}</text><text x="60" y="72" text-anchor="middle" fill="#93a1ac" font-size="8" style="text-transform:uppercase;letter-spacing:1px;">${label}</text><text x="60" y="89" text-anchor="middle" fill="${col}" font-size="10" font-weight="600">${isNaN(dbm) ? (band || '') : dbm.toFixed(0)+' dBm'}</text></svg>`;
                      // v162 - RESTORED. These two were deleted by accident in v160:
                      // the block replaced there ran from `const rep` to `const prov`
                      // and these sat inside it. v161 then called rate(d)/rate(u) on
                      // undeclared variables -> ButtonCardJSTemplateError, and the
                      // whole card refused to render.
                      const d = parseFloat(states['sensor.camper_wan_down']?.state) || 0;
                      const u = parseFloat(states['sensor.camper_wan_up']?.state) || 0;
                      const prov = states['sensor.gl_inet_x3000_cellular_network']?.state || '--';
                      // v161 - the right-hand half held only "Provider" and was mostly
                      // empty. It now carries live WAN throughput as well. d and u
                      // were already being computed here and silently discarded -
                      // leftovers from an earlier layout.
                      // Rates auto-scale: kbps below 1 Mbps, Mbps above. At idle the
                      // link sits around 12 kbps, which would read a useless "0.0
                      // Mbps" on a fixed Mbps scale.
                      const rate = v => v >= 1 ? v.toFixed(1) + ' Mbps'
                                      : (v * 1000) >= 1 ? Math.round(v * 1000) + ' kbps'
                                      : '0 kbps';
                      // flex:1 on every cell keeps the three boxes exactly equal.
                      // v164 - Download/Upload moved OUT of this lambda into their own
                      // stat_card tiles in the top row, so each can be tapped to open
                      // its history/statistics. Cells inside a single button-card
                      // cannot be clicked individually. Provider stays here.
                      // v165 - this card is now JUST the dial. Provider, Download and
                      // Upload each became their own tile so every one can be tapped
                      // for its own history. prov/d/u are no longer rendered here.
                      return `<div style="display:flex;align-items:center;justify-content:center;height:100%;">${svg}</div>`;
                    ]]]
              - type: custom:button-card
                template: stat_card
                entity: sensor.gl_inet_x3000_cellular_network
                name: Provider
                styles: {card: [ {height: 150px} ]}
              # v164 - live WAN throughput, same stat_card style/height as WAN IP.
              # stat_card already carries tap_action: more-info, so tapping one
              # opens its history and long-term statistics.
              # Auto-scales kbps <-> Mbps: the link idles in the low kbps, which
              # a fixed Mbps scale renders as a useless "0.0".
              - type: custom:button-card
                template: stat_card
                entity: sensor.gl_inet_x3000_wan_download_rate
                name: Download
                state_display: |
                  [[[
                    // v166 - reads the ROUTER's own B/s entity and converts here,
                    // so the tile and the entity can never disagree: tap it and the
                    // history you get IS the number on the tile.
                    // The old path went via sensor.camper_wan_down, which rounds to
                    // 3 decimals of Mbps = 1 kbps resolution - that collapsed
                    // 1207 B/s (9.7 kbps) and 1305 B/s (10.4 kbps) onto the same
                    // "10 kbps" and made the dashboard look wrong.
                    const B = parseFloat(entity ? entity.state : NaN);
                    if (isNaN(B)) return '--';
                    const kb = B * 8 / 1000;
                    return kb >= 1000 ? (kb / 1000).toFixed(1) + ' Mbps' : kb.toFixed(1) + ' kbps';
                  ]]]
                styles: {card: [ {height: 150px} ], state: [ {color: "#76bf43"} ]}
              - type: custom:button-card
                template: stat_card
                entity: sensor.gl_inet_x3000_wan_upload_rate
                name: Upload
                state_display: |
                  [[[
                    // v166 - reads the ROUTER's own B/s entity and converts here,
                    // so the tile and the entity can never disagree: tap it and the
                    // history you get IS the number on the tile.
                    // The old path went via sensor.camper_wan_down, which rounds to
                    // 3 decimals of Mbps = 1 kbps resolution - that collapsed
                    // 1207 B/s (9.7 kbps) and 1305 B/s (10.4 kbps) onto the same
                    // "10 kbps" and made the dashboard look wrong.
                    const B = parseFloat(entity ? entity.state : NaN);
                    if (isNaN(B)) return '--';
                    const kb = B * 8 / 1000;
                    return kb >= 1000 ? (kb / 1000).toFixed(1) + ' Mbps' : kb.toFixed(1) + ' kbps';
                  ]]]
                styles: {card: [ {height: 150px} ], state: [ {color: "#3aa6dd"} ]}
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:button-card
                template: stat_card
                entity: sensor.speedtest_download
                name: Download
                state_display: "[[[ const v = parseFloat(entity ? entity.state : NaN); return isNaN(v) ? '-- Mbps' : (v.toFixed(1) + ' Mbps'); ]]]"
                styles: {card: [ {height: 80px} ], state: [ {color: "#76bf43"} ]}
              - type: custom:button-card
                template: stat_card
                entity: sensor.speedtest_upload
                name: Upload
                state_display: "[[[ const v = parseFloat(entity ? entity.state : NaN); return isNaN(v) ? '-- Mbps' : (v.toFixed(1) + ' Mbps'); ]]]"
                styles: {card: [ {height: 80px} ], state: [ {color: "#3aa6dd"} ]}
              - type: custom:button-card
                template: stat_card
                entity: sensor.speedtest_ping
                name: Ping
                state_display: "[[[ const v = parseFloat(entity ? entity.state : NaN); return isNaN(v) ? '-- ms' : (v.toFixed(0) + ' ms'); ]]]"
                styles: {card: [ {height: 80px} ]}
              # v159 - Cell Band replaces the Run Test button (the owner's call).
              # NOTE: the speedtest can no longer be triggered from this tab.
              # Its three result tiles still update on the integration's own
              # schedule; only the manual trigger is gone.
              - type: custom:button-card
                template: stat_card
                entity: sensor.gl_inet_x3000_cellular_band
                name: Cell Band
                state_display: |
                  [[[
                    const b = entity ? entity.state : '';
                    if (!b || b === 'unknown' || b === 'unavailable') return '--';
                    if (b.includes('NR5G')) return '5G';
                    if (b.includes('LTE'))  return '4G';
                    return b;
                  ]]]
                styles: {card: [ {height: 80px} ], state: [ {color: "#76bf43"} ]}
          - type: grid
            columns: 4
            square: false
            cards:
              - type: custom:button-card
                template: stat_card
                entity: binary_sensor.starlink_connectivity
                name: Starlink
                state_display: "[[[ if(!entity||['unavailable','unknown'].includes(entity.state)) return 'Unknown'; return entity.state === 'on' ? 'Connected' : 'Disconnected'; ]]]"
                styles:
                  card: [ {height: 80px} ]
                  state: [ {color: "[[[ if(!entity||['unavailable','unknown'].includes(entity.state)) return '#5c6a75'; return entity.state === 'on' ? '#76bf43' : '#e05252'; ]]]"} ]
              - type: custom:button-card
                template: stat_card
                entity: binary_sensor.starlink_obstructed
                name: Sky View
                state_display: "[[[ if(!entity||['unavailable','unknown'].includes(entity.state)) return 'Unknown'; return entity.state === 'on' ? 'Obstructed' : 'Clear'; ]]]"
                styles:
                  card: [ {height: 80px} ]
                  state: [ {color: "[[[ if(!entity||['unavailable','unknown'].includes(entity.state)) return '#5c6a75'; return entity.state === 'on' ? '#e05252' : '#76bf43'; ]]]"} ]
              - type: custom:button-card
                entity: button.gl_inet_x3000_disconnect_repeater
                name: "[[[ return states['binary_sensor.gl_inet_x3000_repeater_connected']?.state === 'on' ? 'Repeater On' : 'Repeater Off'; ]]]"
                icon: mdi:wifi
                show_state: false
                tap_action: {action: call-service, service: button.press, service_data: {entity_id: button.gl_inet_x3000_disconnect_repeater}, confirmation: {text: "Drop the Wi-Fi repeater?"}}
                styles:
                  card:
                    - height: 80px
                    - background: "linear-gradient(160deg, #1c242c, #11171d)"
                  icon:
                    - width: 22px
                    - color: "[[[ return states['binary_sensor.gl_inet_x3000_repeater_connected']?.state === 'on' ? '#3aa6dd' : '#e8a33d'; ]]]"
                  name: [ {color: "#93a1ac"}, {font-size: "clamp(10px, 0.9vw, 13px)"} ]
              - type: custom:button-card
                template: panel_button
                entity: switch.gl_inet_x3000_repeater_auto_switch_networks
                name: Auto-Switch
                icon: mdi:swap-horizontal
                variables: {on_color: "#3aa6dd"}
                styles: {card: [ {height: 80px} ]}
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                entity: button.gl_inet_x3000_scan_wifi_networks
                name: Scan Wi-Fi
                icon: mdi:wifi-refresh
                show_state: false
                tap_action: {action: call-service, service: button.press, service_data: {entity_id: button.gl_inet_x3000_scan_wifi_networks}}
                styles:
                  card: [ {height: 80px}, {background: "linear-gradient(160deg, #1c242c, #11171d)"} ]
                  icon: [ {color: "#3aa6dd"}, {width: 22px} ]
                  name: [ {color: "#93a1ac"}, {font-size: "clamp(10px, 0.9vw, 13px)"} ]
              - type: custom:button-card
                template: panel_button
                entity: switch.gl_inet_x3000_system_led
                name: Router LED
                icon: mdi:led-on
                variables: {on_color: "#e8a33d"}
                styles: {card: [ {height: 80px} ]}
          - type: entities
            show_header_toggle: false
            entities:
              - entity: select.gl_inet_x3000_wifi_network
                name: Repeat a Wi-Fi network
                icon: mdi:wifi-plus
