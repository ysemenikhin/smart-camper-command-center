#   v201 - Water Pump / Tank & Pipe Heat: ROOT CAUSE of v197-v200.
#          custom:button-card pads its card by a PERCENTAGE of the card WIDTH
#          (4% top/bottom). A half-width tile is ~2.5x wider than a Lighting
#          tile, so the same 4% eats ~2.5x more of the fixed 86px height -
#          that squashed the icon (v197/v199) and pushed icon+text to the
#          bottom edge (v200). Guessing icon sizes was the wrong fix and is
#          removed.
#          Fix: give the wide tile the SAME content box as a Lighting tile,
#          by padding it with values derived from the grid maths (gap g =
#          8px, row width R):
#            Lighting tile w5 = (R-4g)/5 ; half tile w2 = (R-g)/2
#            => w5 = (2*w2 - 3g)/5
#            side padding  = (w2-w5)/2      = 30% + 0.3g  = calc(30% + 2.4px)
#            top/bottom    = 4% of w5       = 1.6% - 0.024g = calc(1.6% - 0.2px)
#          Icon (34%) and text then resolve to exactly the Lighting sizes.
