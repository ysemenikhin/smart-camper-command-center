# CAMPER DASHBOARD  -  v145   (Home Assistant / Lovelace)
# Expedition trailer control panel - Garmin-style dark theme, 10" tablet.
#
# INSTALL
#   Paste this whole file into the dashboard Raw Configuration editor
#   (dashboard -> 3-dot menu -> Edit dashboard -> Raw configuration).
#   NOTE: Home Assistant STRIPS these YAML comments when it saves, so
#   keep THIS file as your documented master copy.
#   Needs HACS cards: custom:button-card, apexcharts-card.
#   Needs HA package v5+ (camper_* templates) and ESP air-suspension
#   v4.4.3+ (camper_air_suspension_* entities).
#
# STRUCTURE
#   button_card_templates : reusable card styles (gauges, tiles, dials)
#   views                 : 7 pages (Home, Energy, Lighting, Switches,
#                           Water, Suspension, Cameras)
#
