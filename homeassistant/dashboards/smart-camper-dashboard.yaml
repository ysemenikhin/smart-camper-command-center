              - type: vertical-stack
                cards:
                  - type: custom:button-card
                    template: charge_box
                  - type: custom:button-card
                    template: stat_card
                    entity: sensor.camper_stored_energy
                    name: Stored Energy
                  - type: custom:apexcharts-card
                    header:
                      show: true
                      title: Solar Production - 24h
                      show_states: false
                    graph_span: 24h
                    apex_config:
