                    # wide in this layout - the glyph existed but was clipped
                    # to nothing, which is why size: 20px (v190) and the icon
                    # wrapper width (v189) both changed nothing. Sizing
                    # img_cell itself is what makes it appear; confirmed live
                    # on the Cameras tab before writing this. --mdc-icon-size
                    # is set explicitly too, because it was inheriting 100%,
                    # which resolves against a zero-height box.
                    # v202 - 43px = Lighting icon size (measured, see header)
                    size: 43px
                    styles:
                      card:
                        # v204 - 64px = the box height before v203 (measured);
                        # padding 0 so icon+text are centred inside it.
                        - height: 64px
                        - padding: 0px
                      grid:
                        - grid-template-areas: '"i n"'
                        - grid-template-columns: auto auto
                        - justify-content: center
                        - align-items: center
                        - column-gap: 8px
                      img_cell:
                        - width: 43px
                        - min-width: 43px
                        - height: 43px
                        - overflow: visible
                      icon:
                        - width: 43px
                        - height: 43px
                        - "--mdc-icon-size": 43px
              # v188 - Rear has no light of its own, so this cell used to be
              # camera-only and sat shorter than the other three. It now
              # carries the All Lights key, which both fills that gap and puts
              # every light one press away while you are looking at the feeds.
              # One button both ways: any light on -> all off, none on -> all
