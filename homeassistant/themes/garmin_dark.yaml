# Garmin-style dark theme for Smart Camper Command Center (v4.0)
# v4.0: Consolidated modern element fixes for white boxes, selection lists, and code editor.
# Place in /homeassistant/themes/garmin_dark.yaml
garmin_dark:
  # Base colors
  primary-color: "#3aa6dd"
  accent-color: "#76bf43"
  primary-text-color: "#e8edf2"
  secondary-text-color: "#93a1ac"
  disabled-text-color: "#5c6a75"
  divider-color: "#232b33"
  # Background (dark carbon look)
  primary-background-color: "#0e1216"
  secondary-background-color: "#12171c"
  lovelace-background: "radial-gradient(ellipse at 50% 0%, #171e25 0%, #0d1115 60%, #090c0f 100%)"
  # Cards
  card-background-color: "#151b21"
  ha-card-background: "#151b21"
  ha-card-border-radius: "14px"
  ha-card-border-width: "1px"
  ha-card-border-color: "#242e37"
  ha-card-box-shadow: "0 4px 14px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.03)"
  # Header / tabs
  app-header-background-color: "#0b0f13"
  app-header-text-color: "#93a1ac"
  app-header-selection-bar-color: "#3aa6dd"
  # Sidebar
  sidebar-background-color: "#0b0f13"
  sidebar-text-color: "#93a1ac"
  sidebar-selected-text-color: "#3aa6dd"
  sidebar-icon-color: "#5c6a75"
  sidebar-selected-icon-color: "#3aa6dd"
  # States
  state-icon-color: "#7e8b96"
  state-icon-active-color: "#76bf43"
  switch-checked-color: "#76bf43"
  switch-unchecked-color: "#3a444d"
  # Sliders / toggles
  slider-color: "#3aa6dd"
  slider-secondary-color: "#1f5e80"
  slider-track-color: "#232b33"
  paper-slider-knob-color: "#3aa6dd"
  paper-slider-active-color: "#3aa6dd"
  # ---------------- DIALOGS ----------------
  dialog-background-color: "#151b21"
  mdc-dialog-heading-ink-color: "#e8edf2"
  mdc-dialog-content-ink-color: "#e8edf2"
  mdc-theme-surface: "#151b21"
  mdc-theme-on-surface: "#e8edf2"
  mdc-theme-text-primary-on-background: "#e8edf2"
  mdc-theme-text-secondary-on-background: "#93a1ac"
  mdc-theme-text-icon-on-background: "#7e8b96"
  mdc-theme-text-hint-on-background: "#5c6a75"
  mdc-theme-text-disabled-on-background: "#5c6a75"
  # ---------------- TEXT FIELDS / NUMBER BOXES ----------------
  input-fill-color: "#10151a"
  input-ink-color: "#e8edf2"
  input-label-ink-color: "#93a1ac"
  input-disabled-fill-color: "#12171c"
  input-disabled-ink-color: "#5c6a75"
  input-idle-line-color: "#3a444d"
  input-hovered-line-color: "#3aa6dd"
  input-dropdown-icon-color: "#93a1ac"
  mdc-text-field-fill-color: "#10151a"
  mdc-text-field-ink-color: "#e8edf2"
  mdc-text-field-label-ink-color: "#93a1ac"
  mdc-text-field-idle-line-color: "#3a444d"
  mdc-text-field-hover-line-color: "#3aa6dd"
  mdc-text-field-disabled-fill-color: "#12171c"
  mdc-text-field-disabled-ink-color: "#5c6a75"
  mdc-text-field-disabled-line-color: "#232b33"
  # Fallbacks for classic input fields
  text-field-ink-color: "#e8edf2"
  ha-textfield-ink-color: "#e8edf2"
  ha-textfield-label-color: "#93a1ac"
  paper-input-container-input-color: "#e8edf2"
  paper-input-container-shared-input-style-color: "#e8edf2"
  # Core variables targeting modern form layouts (Removes White Fields)
  ha-color-form-background: "#10151a"
  ha-color-form-background-hover: "#12171c"
  ha-color-form-background-disabled: "#0e1216"
  wa-color-neutral-fill-normal: "#10151a"
  # ---------------- SELECTS / DROPDOWN MENUS ----------------
  mdc-select-fill-color: "#10151a"
  mdc-select-ink-color: "#e8edf2"
  mdc-select-label-ink-color: "#93a1ac"
  mdc-select-dropdown-icon-color: "#93a1ac"
  mdc-select-idle-line-color: "#3a444d"
  mdc-select-hover-line-color: "#3aa6dd"
  mdc-select-disabled-fill-color: "#12171c"
  mdc-select-disabled-ink-color: "#5c6a75"
  mdc-select-disabled-dropdown-icon-color: "#5c6a75"
  # Menu surfaces & overlay styling (Removes Bright White Selections)
  mdc-menu-surface-fill-color: "#151b21"
  mdc-menu-surface-ink-color: "#e8edf2"
  mdc-list-item-graphic-color: "#7e8b96"
  mdc-list-side-padding: "16px"
  ha-select-ink-color: "#e8edf2"
  mdc-theme-primary: "#3aa6dd"
  mdc-list-item-selected-container-background-color: "#12171c"
  mdc-list-item-activated-container-background-color: "#12171c"
  # ---------------- CHECKBOXES / RADIO ----------------
  mdc-checkbox-unchecked-color: "#5c6a75"
  mdc-radio-unchecked-color: "#5c6a75"
  # ---------------- CODE EDITOR (YAML Editors) ----------------
  code-editor-background-color: "#10151a"
  code-editor-text-color: "#e8edf2"
  codemirror-property: "#3aa6dd"
  codemirror-string: "#76bf43"
  codemirror-keyword: "#e8a33d"
  codemirror-number: "#e8a33d"
  codemirror-atom: "#b487e0"
  codemirror-comment: "#5c6a75"
  codemirror-cursor: "#e8edf2"
  codemirror-operator: "#93a1ac"
  codemirror-variable: "#3aa6dd"
  # Misc
  warning-color: "#e8a33d"
  error-color: "#e05252"
  success-color: "#76bf43"
  info-color: "#3aa6dd"
